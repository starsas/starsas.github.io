<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d4450"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a919c"/></marker>
    <style>
      .title { font-size: 27px; font-weight: 700; fill: #1f2328; letter-spacing: -0.2px; }
      .sec   { font-size: 17px; font-weight: 600; fill: #1f2328; }
      .tag   { font-size: 17px; font-weight: 700; fill: #1f5f8b; }
      .bt    { font-size: 16px; font-weight: 600; fill: #1f2328; }
      .tx    { font-size: 14.5px; fill: #2f3640; }
      .mu    { font-size: 13px; fill: #6b7380; }
      .ac    { font-size: 14.5px; fill: #1f5f8b; font-weight: 600; }
      .mono  { font-family: "DejaVu Sans Mono", Menlo, monospace; font-size: 13px; fill: #2f3640; }
      .lab   { font-size: 13px; fill: #6b7380; }
      .card  { fill: #ffffff; stroke: #cfd5dc; stroke-width: 1.3; }
      .flow  { stroke: #3d4450; stroke-width: 1.8; fill: none; }
      .sep   { stroke: #e3e6ea; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1600" height="800" fill="#ffffff"/>

  <text class="title" x="40" y="54">LLM-Based Cooperative Decision-Making for Highway On-Ramp Merging</text>

  <!-- per-CAV loop region -->
  <rect x="330" y="124" width="915" height="588" rx="14" fill="#f6f8fa" stroke="#b9c1ca" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text class="mu" x="1233" y="146" text-anchor="end" font-style="italic">repeated for each CAV in priority order</text>

  <!-- section headers -->
  <text x="40"   y="106"><tspan class="tag">(a)</tspan><tspan class="sec" dx="7">Traffic environment</tspan></text>
  <text x="350"  y="106"><tspan class="tag">(b)</tspan><tspan class="sec" dx="7">Priority &amp; observation</tspan></text>
  <text x="650"  y="106"><tspan class="tag">(c)</tspan><tspan class="sec" dx="7">LLM planning</tspan></text>
  <text x="955"  y="106"><tspan class="tag">(d)</tspan><tspan class="sec" dx="7">Safety evaluation</tspan></text>
  <text x="1270" y="106"><tspan class="tag">(e)</tspan><tspan class="sec" dx="7">Joint execution</tspan></text>

  <!-- ===================== (a) ===================== -->
  <text class="mu" x="40" y="144">2 mainline lanes + 1 merging ramp</text>
  <!-- road: 2 mainline lanes; ramp joins as a parallel acceleration lane (merge zone), then tapers out -->
  <rect x="40" y="162" width="270" height="72" fill="#eef1f4"/>
  <path d="M40,282 C80,282 100,234 140,234 H250 L296,234 L250,270 H140 C100,270 80,318 40,318 Z" fill="#eef1f4"/>
  <rect x="140" y="234" width="110" height="36" fill="#1f5f8b" fill-opacity="0.08"/>
  <line x1="40" y1="162" x2="310" y2="162" stroke="#4a5361" stroke-width="2"/>
  <line x1="40" y1="198" x2="310" y2="198" stroke="#4a5361" stroke-width="1.5" stroke-dasharray="10 8"/>
  <line x1="40" y1="234" x2="140" y2="234" stroke="#4a5361" stroke-width="2"/>
  <line x1="140" y1="234" x2="250" y2="234" stroke="#4a5361" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="250" y1="234" x2="310" y2="234" stroke="#4a5361" stroke-width="2"/>
  <path d="M40,282 C80,282 100,234 140,234" stroke="#4a5361" stroke-width="2" fill="none"/>
  <path d="M40,318 C80,318 100,270 140,270 H250 L296,234" stroke="#4a5361" stroke-width="2" fill="none"/>
  <line x1="140" y1="228" x2="140" y2="276" stroke="#1f5f8b" stroke-width="1.2"/>
  <line x1="250" y1="228" x2="250" y2="276" stroke="#1f5f8b" stroke-width="1.2"/>
  <text x="195" y="292" text-anchor="middle" font-size="12" font-weight="600" fill="#1f5f8b">merge zone</text>
  <text x="104" y="308" font-size="11.5" fill="#6b7380">ramp</text>
  <!-- cars: CAV blue, HDV grey -->
  <g>
    <rect x="62" y="171" width="36" height="19" rx="5" fill="#2f6fa3"/><rect x="83" y="174" width="9" height="13" rx="2" fill="#cfe0ee"/>
    <rect x="196" y="171" width="36" height="19" rx="5" fill="#a9b0b8"/><rect x="217" y="174" width="9" height="13" rx="2" fill="#eceef0"/>
    <line x1="240" y1="180" x2="266" y2="180" stroke="#6b7380" stroke-width="1.4" marker-end="url(#am)"/>
    <rect x="70" y="207" width="36" height="19" rx="5" fill="#a9b0b8"/><rect x="91" y="210" width="9" height="13" rx="2" fill="#eceef0"/>
    <rect x="240" y="207" width="36" height="19" rx="5" fill="#2f6fa3"/><rect x="261" y="210" width="9" height="13" rx="2" fill="#cfe0ee"/>
    <rect x="150" y="243" width="36" height="19" rx="5" fill="#2f6fa3"/><rect x="171" y="246" width="9" height="13" rx="2" fill="#cfe0ee"/>
    <path d="M188,250 C200,248 206,232 220,220" stroke="#1f5f8b" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#ab)"/>
    <g transform="rotate(-38 88 278)"><rect x="70" y="269" width="36" height="19" rx="5" fill="#2f6fa3"/><rect x="91" y="272" width="9" height="13" rx="2" fill="#cfe0ee"/></g>
  </g>
  <rect x="40" y="335" width="16" height="11" rx="2.5" fill="#2f6fa3"/><text class="mu" x="63" y="345">CAV</text>
  <rect x="112" y="335" width="16" height="11" rx="2.5" fill="#a9b0b8"/><text class="mu" x="135" y="345">HDV (IDM)</text>

  <!-- Traffic state -->
  <rect class="card" x="40" y="430" width="270" height="132" rx="9"/>
  <text class="bt" x="58" y="460">Traffic state</text>
  <line class="sep" x1="58" y1="472" x2="292" y2="472"/>
  <text class="tx" x="58" y="496">Ego: lane, position, speed</text>
  <text class="tx" x="58" y="520">Nearby CAVs and HDVs</text>
  <text class="tx" x="58" y="544">Road topology and merge zone</text>
  <text x="40" y="608" font-size="15" font-weight="700" fill="#1f2328">highway-env</text>
  <text class="mono" x="40" y="630" fill="#6b7380">merge-multi-agent-v0</text>

  <!-- ===================== (b) ===================== -->
  <rect class="card" x="350" y="162" width="265" height="164" rx="9"/>
  <text class="bt" x="368" y="192">Priority queue</text>
  <line class="sep" x1="368" y1="204" x2="597" y2="204"/>
  <text x="368" y="232" font-size="15" font-weight="700" fill="#1f5f8b">1</text><text class="tx" x="392" y="232">Ramp CAVs</text>
  <line class="sep" x1="368" y1="246" x2="597" y2="246"/>
  <text x="368" y="270" font-size="15" font-weight="700" fill="#1f5f8b">2</text><text class="tx" x="392" y="270">Mainline: merge zone</text>
  <line class="sep" x1="368" y1="284" x2="597" y2="284"/>
  <text x="368" y="308" font-size="15" font-weight="700" fill="#1f5f8b">3</text><text class="tx" x="392" y="308">Other mainline CAVs</text>

  <line class="flow" x1="482" y1="326" x2="482" y2="426" marker-end="url(#a)"/>
  <rect x="425" y="364" width="114" height="22" fill="#f6f8fa"/>
  <text class="lab" x="482" y="380" text-anchor="middle">select ego CAV</text>

  <rect class="card" x="350" y="430" width="265" height="132" rx="9"/>
  <text class="bt" x="368" y="460">Tool-based observation</text>
  <line class="sep" x1="368" y1="472" x2="597" y2="472"/>
  <g font-family="DejaVu Sans Mono, Menlo, monospace" font-size="12" font-weight="700" fill="#c0661a">
    <text x="368" y="496">ƒ</text><text x="368" y="520">ƒ</text><text x="368" y="544">ƒ</text>
  </g>
  <text class="tx" x="386" y="496">Available actions</text>
  <text class="tx" x="386" y="520">Reachable lanes</text>
  <text class="tx" x="386" y="544">Nearby vehicles (30 m)</text>

  <!-- ===================== (c) ===================== -->
  <path d="M650,171 a9,9 0 0 1 9,-9 H895 L920,187 V317 a9,9 0 0 1 -9,9 H659 a9,9 0 0 1 -9,-9 Z" class="card"/>
  <path d="M895,162 V187 H920" fill="#eef1f4" stroke="#cfd5dc" stroke-width="1.3"/>
  <text class="bt" x="668" y="192">Prompt context</text>
  <line class="sep" x1="668" y1="204" x2="880" y2="204"/>
  <text class="tx" x="668" y="230">Scene structure</text>
  <text class="tx" x="668" y="254">Traffic rules</text>
  <text class="tx" x="668" y="278">Merging / yielding strategy</text>
  <text class="ac" x="668" y="304">Shared CAV intentions</text>

  <line class="flow" x1="785" y1="326" x2="785" y2="426" marker-end="url(#a)"/>
  <rect x="704" y="364" width="162" height="22" fill="#f6f8fa"/>
  <text class="lab" x="785" y="380" text-anchor="middle">context + observations</text>

  <rect x="650" y="430" width="270" height="132" rx="9" fill="#e9f1f8" stroke="#1f5f8b" stroke-width="1.8"/>
  <rect x="668" y="446" width="30" height="30" rx="7" fill="#1f5f8b"/>
  <text x="683" y="466" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">LLM</text>
  <text x="708" y="468" font-size="19" font-weight="700" fill="#1f5f8b">DeepSeek-V3</text>
  <line x1="668" y1="488" x2="902" y2="488" stroke="#c4d6e6" stroke-width="1"/>
  <text class="tx" x="785" y="514" text-anchor="middle">Interpret the current scene</text>
  <text x="785" y="542" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Rank candidate actions</text>

  <text class="mu" x="650" y="606">Five-action space</text>
  <text class="mono" x="650" y="630">IDLE · FASTER · SLOWER</text>
  <text class="mono" x="650" y="652">LANE_LEFT · LANE_RIGHT</text>

  <!-- ===================== (d) ===================== -->
  <rect class="card" x="955" y="162" width="270" height="164" rx="9"/>
  <text class="bt" x="973" y="192">Trajectory conflict check</text>
  <rect x="973" y="208" width="234" height="66" fill="#eef1f4"/>
  <line x1="973" y1="208" x2="1207" y2="208" stroke="#4a5361" stroke-width="1.4"/>
  <line x1="973" y1="241" x2="1207" y2="241" stroke="#4a5361" stroke-width="1.2" stroke-dasharray="7 6"/>
  <line x1="973" y1="274" x2="1207" y2="274" stroke="#4a5361" stroke-width="1.4"/>
  <rect x="982" y="249" width="32" height="17" rx="4" fill="#2f6fa3"/><rect x="1001" y="252" width="8" height="11" rx="2" fill="#cfe0ee"/>
  <rect x="1000" y="216" width="32" height="17" rx="4" fill="#a9b0b8"/><rect x="1019" y="219" width="8" height="11" rx="2" fill="#eceef0"/>
  <line x1="1036" y1="224" x2="1086" y2="224" stroke="#6b7380" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#am)"/>
  <path d="M1016,257 C1052,257 1062,226 1100,224 H1192" stroke="#1f5f8b" stroke-width="2" fill="none" marker-end="url(#ab)"/>
  <circle cx="1096" cy="225" r="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
  <line x1="1091" y1="220" x2="1101" y2="230" stroke="#c0392b" stroke-width="2"/>
  <line x1="1101" y1="220" x2="1091" y2="230" stroke="#c0392b" stroke-width="2"/>
  <text x="973" y="298" font-size="12.5" fill="#1f5f8b" font-weight="600">— predicted CAV path</text>
  <text x="973" y="316" font-size="12.5" fill="#6b7380">- - HDV motion + shared intentions</text>

  <line class="flow" x1="1090" y1="326" x2="1090" y2="426" marker-end="url(#a)"/>

  <rect class="card" x="955" y="430" width="270" height="132" rx="9"/>
  <text class="bt" x="973" y="460">Evaluate candidates in order</text>
  <line class="sep" x1="973" y1="472" x2="1207" y2="472"/>
  <text x="973" y="496" font-size="15" font-weight="700" fill="#2e8b57">✓</text><text class="tx" x="993" y="496">Speed, gap and lane rules</text>
  <text x="973" y="520" font-size="15" font-weight="700" fill="#2e8b57">✓</text><text class="tx" x="993" y="520">Trajectory conflicts</text>
  <line class="sep" x1="973" y1="532" x2="1207" y2="532"/>
  <text class="ac" x="1090" y="552" text-anchor="middle">Select first passing action</text>
  <!-- fail loop -->
  <path d="M1185,562 V594 H995 V566" stroke="#8a919c" stroke-width="1.4" stroke-dasharray="4 4" fill="none" marker-end="url(#am)"/>
  <rect x="1020" y="583" width="140" height="22" fill="#f6f8fa"/>
  <text class="lab" x="1090" y="599" text-anchor="middle">fail: next candidate</text>

  <!-- ===================== (e) ===================== -->
  <rect class="card" x="1270" y="162" width="290" height="164" rx="9"/>
  <text class="bt" x="1288" y="192">Example action set</text>
  <line class="sep" x1="1288" y1="204" x2="1542" y2="204"/>
  <text class="mu" x="1288" y="224" font-weight="600">Agent</text><text class="mu" x="1400" y="224" font-weight="600">Action</text>
  <line x1="1288" y1="233" x2="1542" y2="233" stroke="#cfd5dc" stroke-width="1"/>
  <text class="ac" x="1288" y="255">CAV 1</text><text class="mono" x="1400" y="255">FASTER</text>
  <line class="sep" x1="1288" y1="266" x2="1542" y2="266"/>
  <text class="ac" x="1288" y="284">CAV 2</text><text class="mono" x="1400" y="284">IDLE</text>
  <line class="sep" x1="1288" y1="295" x2="1542" y2="295"/>
  <text class="ac" x="1288" y="313">CAV 3</text><text class="mono" x="1400" y="313">IDLE</text>

  <line class="flow" x1="1415" y1="326" x2="1415" y2="426" marker-end="url(#a)"/>
  <rect x="1340" y="364" width="150" height="22" fill="#ffffff"/>
  <text class="lab" x="1415" y="380" text-anchor="middle">after all CAVs decide</text>

  <rect class="card" x="1270" y="430" width="290" height="132" rx="9"/>
  <text class="bt" x="1288" y="460">Joint action execution</text>
  <line class="sep" x1="1288" y1="472" x2="1542" y2="472"/>
  <text class="tx" x="1288" y="496">Apply CAV actions</text>
  <text class="tx" x="1288" y="520">Advance the simulator</text>
  <text class="tx" x="1288" y="544">Update vehicle states</text>

  <path d="M1272,594 h14 l6,6 v20 h-20 z" fill="#ffffff" stroke="#8a919c" stroke-width="1.3"/>
  <line x1="1276" y1="606" x2="1288" y2="606" stroke="#8a919c"/><line x1="1276" y1="612" x2="1288" y2="612" stroke="#8a919c"/>
  <text class="tx" x="1304" y="606">Trajectory + decision logs</text>
  <text class="mu" x="1304" y="626">Video and CSV</text>

  <!-- ===================== main flows ===================== -->
  <path class="flow" d="M310,450 H322 V244 H346" marker-end="url(#a)"/>
  <line class="flow" x1="310" y1="496" x2="346" y2="496" marker-end="url(#a)"/>
  <line class="flow" x1="615" y1="496" x2="646" y2="496" marker-end="url(#a)"/>
  <line class="flow" x1="920" y1="496" x2="951" y2="496" marker-end="url(#a)"/>
  <line class="flow" x1="1225" y1="496" x2="1266" y2="496" marker-end="url(#a)"/>

  <!-- per-CAV loop: share intention, next vehicle -->
  <path d="M1247,496 V682 H482 V566" stroke="#1f5f8b" stroke-width="1.8" fill="none" marker-end="url(#ab)"/>
  <circle cx="1247" cy="496" r="3.5" fill="#1f5f8b"/>
  <rect x="635" y="670" width="450" height="24" fill="#f6f8fa"/>
  <text x="860" y="687" text-anchor="middle" font-size="14" font-weight="600" fill="#1f5f8b">Share accepted CAV intention; continue with the next vehicle</text>

  <!-- time-step loop -->
  <path class="flow" d="M1560,496 H1580 V758 H20 V496 H36" marker-end="url(#a)"/>
  <rect x="540" y="746" width="520" height="24" fill="#ffffff"/>
  <text x="800" y="763" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3d4450">Next time step: update the traffic scene and rebuild the priority queue</text>
</svg>
